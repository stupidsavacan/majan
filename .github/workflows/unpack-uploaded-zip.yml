name: Unpack uploaded ZIP

on:
  push:
    paths:
      - 'uploads/**/*.zip'
      - 'uploads/*.zip'
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare output directory
        run: mkdir -p extracted-zips
      - name: Unpack zip files
        run: |
          for zip_file in uploads/*.zip uploads/**/*.zip; do
            [ -f "$zip_file" ] || continue
            name="$(basename "$zip_file" .zip)"
            mkdir -p "extracted-zips/$name"
            unzip -q -o "$zip_file" -d "extracted-zips/$name"
          done
      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-zips
          path: extracted-zips
