name: Unpack uploaded ZIP

on:
  push:
    branches:
      - main
    paths:
      - "uploads/**/*.zip"
      - "uploads/*.zip"
      - ".github/workflows/unpack-uploaded-zip.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: unpack-uploaded-zip
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unpack zip files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted-zips
          mkdir -p extracted-zips

          while IFS= read -r -d '' zip_file; do
            name="$(basename "$zip_file" .zip)"
            destination="extracted-zips/$name"
            temporary_directory="$(mktemp -d)"

            unzip -q -o "$zip_file" -d "$temporary_directory"
            mkdir -p "$destination"

            mapfile -d '' entries < <(find "$temporary_directory" -mindepth 1 -maxdepth 1 -print0)
            if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
              cp -a "${entries[0]}/." "$destination/"
            else
              cp -a "$temporary_directory/." "$destination/"
            fi

            rm -rf "$temporary_directory"
          done < <(find uploads -type f -iname "*.zip" -print0)

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-zips
          path: extracted-zips

      - name: Run full test suite
        run: node tests/run-all-tests.js

      - name: Commit and push extraction branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/unpack-uploaded-zip"
          git switch -C "$branch"
          git add extracted-zips
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update unpacked ZIP contents"
          git push --force-with-lease origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update extraction pull request
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/unpack-uploaded-zip"
          title="Update unpacked ZIP contents"
          body="Automated ZIP extraction passed node tests/run-all-tests.js. Review the extracted changes before merging."
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
