<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline Sanma Mahjong - Phase 3</title>
  <link rel="stylesheet" href="extracted-zips/offline-sanma-mahjong-phase1/src/styles/yuji-mai-embedded.css" />
  <link rel="stylesheet" href="extracted-zips/offline-sanma-mahjong-phase1/src/styles/main.css" />
</head>
<body>
  <div id="app" class="app-shell"><header class="top-bar"><div><h1>オフライン三麻 Phase 3</h1><p class="subtitle">役判定と最終牌デザインまでの土台版</p></div><div class="top-actions"><button id="newGameButton" type="button">新しい局</button><button id="settingsButton" type="button">設定</button><button id="debugButton" type="button">デバッグ</button></div></header><main class="table-wrap"><section id="tableRoot" class="mahjong-table" aria-label="麻雀卓"></section></main><section id="messagePanel" class="message-panel" aria-live="polite"></section></div>
  <dialog id="settingsDialog" class="panel-dialog"><form method="dialog" class="panel-card"><div class="panel-head"><h2>ルール設定</h2><button value="close" type="submit" class="icon-button">×</button></div><div id="settingsRoot" class="settings-grid"></div><div class="panel-actions"><button id="saveSettingsButton" value="close" type="submit">保存して新しい局</button></div></form></dialog>
  <dialog id="debugDialog" class="panel-dialog"><form method="dialog" class="panel-card panel-card-wide"><div class="panel-head"><h2>デバッグ</h2><button value="close" type="submit" class="icon-button">×</button></div><div class="debug-layout"><div><label class="field-label" for="seedInput">固定seed</label><input id="seedInput" type="text" placeholder="例: sanma-001" /><button id="applySeedButton" value="close" type="submit">seedで新しい局</button><button id="resetStorageButton" type="button" class="danger">localStorageリセット</button></div><pre id="debugRoot" class="debug-output"></pre></div></form></dialog>
  <script src="extracted-zips/offline-sanma-mahjong-phase1/src/game/RuleConfig.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/game/Tile.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/game/HandAnalysis.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/game/YakuAnalysis.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/game/Wall.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/game/Player.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/game/GameEngine.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/storage/settingsStorage.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/ui/renderTiles.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/ui/renderTable.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/ui/settingsPanel.js"></script><script src="extracted-zips/offline-sanma-mahjong-phase1/src/main.js"></script>
</body>
</html>
